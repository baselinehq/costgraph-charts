{{- if .Values.aggregator.enabled }}
{{- $name := printf "%s-vmalert" (include "costgraph-selfhosted.fullname" .) }}
{{- $store := include "costgraph-selfhosted.metricsStoreURL" . }}
{{/*
Two rule sets, two deployments: long-window rules feed the daily rollups,
short-window rules feed the recent views. One replica each on purpose -- a
second would evaluate the same rules and write the same series.

The rules come from the aggregator image, which already ships them.
*/}}
{{- range $set := list "long" "short" }}
{{- $suffix := ternary "" "-short" (eq $set "long") }}
{{- $component := printf "vmalert%s" $suffix }}
---
{{ include "costgraph.vmalert" (dict
    "ctx" $
    "name" (printf "%s%s" $name $suffix)
    "labels" (merge (dict "app.kubernetes.io/component" $component) (include "costgraph-selfhosted.labels" $ | fromYaml))
    "selectorLabels" (merge (dict "app.kubernetes.io/component" $component) (include "costgraph-selfhosted.selectorLabels" $ | fromYaml))
    "image" (printf "%s:%s" $.Values.aggregator.vmalert.image.repository $.Values.aggregator.vmalert.image.tag)
    "imagePullPolicy" $.Values.aggregator.image.pullPolicy
    "imagePullSecrets" (include "costgraph-selfhosted.imagePullSecrets" $ | fromYamlArray)
    "rulesImage" (include "costgraph-selfhosted.imageRef" (dict "repository" $.Values.aggregator.image.repository "tag" (required "aggregator.image.tag is required" $.Values.aggregator.image.tag)))
    "rulesPath" (printf "/recording-rules/%s" $set)
    "datasourceURL" $store
    "remoteWriteURL" $store
    "resources" $.Values.aggregator.vmalert.resources
    "podSecurityContext" $.Values.podSecurityContext
    "containerSecurityContext" $.Values.securityContext
    "nodeSelector" $.Values.nodeSelector
    "tolerations" $.Values.tolerations
) }}
{{- end }}
{{- end }}
