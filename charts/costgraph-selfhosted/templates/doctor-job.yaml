{{- if and .Values.doctor.enabled (not .Values.global.postgres.bundled.enabled) }}
{{/*
No serviceAccountName: the chart's ServiceAccount is not created until the main
release, and a pre-upgrade hook referencing it cannot schedule. The check needs
no API access.
*/}}
{{ include "costgraph.job" (dict
    "ctx" $
    "name" (printf "%s-doctor" (include "costgraph-selfhosted.fullname" .))
    "labels" (include "costgraph-selfhosted.labels" . | fromYaml)
    "podLabels" (merge (dict "app.kubernetes.io/component" "doctor") (include "costgraph-selfhosted.selectorLabels" . | fromYaml))
    "annotations" (dict
        "helm.sh/hook" "pre-upgrade"
        "helm.sh/hook-weight" "-5"
        "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded")
    "backoffLimit" 0
    "restartPolicy" "Never"
    "imagePullSecrets" (include "costgraph-selfhosted.imagePullSecrets" . | fromYamlArray)
    "podSecurityContext" .Values.global.podSecurityContext
    "containerSecurityContext" .Values.global.securityContext
    "containerName" "doctor"
    "image" (include "costgraph-selfhosted.image" .)
    "imagePullPolicy" .Values.backend.deployment.image.pullPolicy
    "command" (list "/usr/local/bin/selfhost-doctor" "-offline")
    "envFrom" (list (dict "configMapRef" (dict "name" (include "costgraph-selfhosted.fullname" .))))
    "env" (list
        (dict "name" "DB_URL" "valueFrom" (dict "secretKeyRef" (dict "name" (include "costgraph-selfhosted.postgresSecretName" .) "key" "postgres-url")))
        (dict "name" "DB_PASSWORD" "valueFrom" (dict "secretKeyRef" (dict "name" (include "costgraph-selfhosted.postgresSecretName" .) "key" "postgres-password" "optional" true)))
        (dict "name" "CONTROL_PLANE_API_KEY" "valueFrom" (dict "secretKeyRef" (dict "name" (include "costgraph-selfhosted.secretName" .) "key" "control-plane-api-key")))
        (dict "name" "API_KEY_SECRET" "value" "doctor-preflight-placeholder")
        (dict "name" "INTEGRATIONS_ENCRYPTION_KEY" "value" "ZG9jdG9yLXByZWZsaWdodC0zMi1ieXRlLXBsYWNlaG9sZA=="))
    "resources" (dict "requests" (dict "cpu" "100m" "memory" "128Mi"))
    "volumeMounts" (list (dict "name" "tmp" "mountPath" "/tmp"))
    "volumes" (list (dict "name" "tmp" "emptyDir" dict))
) }}
{{- end }}
