{{- $data := dict
    "DEPLOYMENT_MODE" "on_prem"
    "DEPLOYMENT_NAME" (.Values.deploymentName | default .Release.Name)
    "CONTROL_PLANE_URL" .Values.global.controlPlane.url
    "DEPLOYMENT_CONFIG_PUBLIC_KEY" .Values.global.controlPlane.configPublicKey
    "APP_BASE_URL" .Values.global.appBaseURL
    "AUTH_PROVIDER_NAME" "cognito"
    "PRICING_SYNC_INTERVAL" "24h"
    "METERING_PUSH_INTERVAL" "24h"
    "MIGRATE" (ternary "1" "0" (and .Values.global.postgres.runMigrations .Values.global.postgres.bundled.enabled))
    "PORT" "8080"
    "ENVIRONMENT" "production"
}}
{{/*
The browser calls the API from the dashboard's origin. Defaults to appBaseURL,
which is that origin; override when the dashboard is served from somewhere
else, or to allow several.
*/}}
{{- $_ := set $data "CORS_ALLOWED_ORIGINS" (.Values.global.corsAllowedOrigins | default .Values.global.appBaseURL) }}
{{- with (.Values.cognito).region }}{{ $_ := set $data "COGNITO_REGION" . }}{{ end }}
{{- with (.Values.cognito).userPoolId }}{{ $_ := set $data "COGNITO_USER_POOL_ID" . }}{{ end }}
{{- with (.Values.cognito).userPoolClientId }}{{ $_ := set $data "AUTH_AUDIENCE" . }}{{ end }}
{{- with (.Values.cognito).jwksURL }}{{ $_ := set $data "COGNITO_JWKS_URL" . }}{{ end }}
{{- if not .Values.global.redis.existingSecret }}
{{- with (include "costgraph-selfhosted.redisURL" .) }}{{ $_ := set $data "REDIS_URL" . }}{{ end }}
{{- end }}
{{- with (include "costgraph-selfhosted.metricsStoreURL" .) }}{{ $_ := set $data "METRICS_STORE_URL" . }}{{ end }}
{{ include "costgraph.configMap" (dict
    "ctx" $
    "name" (include "costgraph-selfhosted.fullname" .)
    "labels" (include "costgraph-selfhosted.labels" . | fromYaml)
    "data" $data
) }}
