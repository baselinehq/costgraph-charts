nameOverride: ""

# Label for this deployment in the CostGraph dashboard, so you can tell
# several of them apart. Defaults to the Helm release name.
deploymentName: ""

# Every component below is described the same way, whichever chart renders it:
#
#   <component>:
#     enabled:          whether the component is deployed at all
#     applicationName:  the name of its objects
#     rbac:             serviceAccount to run as
#     service:          the ports it publishes
#     deployment:       the pod, or statefulSet: for the ones that keep state
#
# The five that stakater's application chart renders and the three this chart
# renders itself read the same keys, so a component can be turned on, pinned or
# resized without knowing which of the two produced it.

backend:
  enabled: true
  applicationName: costgraph-selfhosted
  rbac:
    enabled: true
    # The ServiceAccount every component runs as. Created here, once.
    serviceAccount:
      create: true
      name: costgraph-selfhosted
  service:
    type: ClusterIP
    ports:
      - name: http
        port: 8080
        targetPort: http
        protocol: TCP
  deployment:
    enabled: true
    replicas: 2
    image:
      repository: registry.costgraph.ai/backend
      tag: sha-13ae198
      pullPolicy: IfNotPresent
    # Not templated by stakater, so global.imagePullSecrets does not reach it.
    # Replace this entry when you supply your own registry credentials.
    imagePullSecrets:
      - name: costgraph-selfhosted-registry
    automountServiceAccountToken: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      fsGroup: 10001
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    ports:
      - name: http
        containerPort: 8080
        protocol: TCP
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        memory: 2Gi
    envFrom:
      config:
        type: configmap
        name: costgraph-selfhosted
    env:
      # Rolls the pods when anything they are built from changes.
      VALUES_HASH:
        value: '{{ toYaml .Values | sha256sum }}'
      CONTROL_PLANE_API_KEY:
        valueFrom:
          secretKeyRef:
            name: '{{ include "costgraph-selfhosted.secretName" . }}'
            key: control-plane-api-key
      PRICING_API_KEY:
        valueFrom:
          secretKeyRef:
            name: '{{ include "costgraph-selfhosted.secretName" . }}'
            key: pricing-api-key
      REMOTE_WRITE_URL:
        value: '{{ printf "%s/api/v1/write" (include "costgraph-selfhosted.metricsStoreURL" .) }}'
      DB_URL:
        valueFrom:
          secretKeyRef:
            name: '{{ include "costgraph-selfhosted.postgresSecretName" . }}'
            key: postgres-url
      REDIS_URL:
        valueFrom:
          secretKeyRef:
            name: '{{ include "costgraph-selfhosted.redisSecretName" . }}'
            key: redis-url
      DB_PASSWORD:
        valueFrom:
          secretKeyRef:
            name: '{{ include "costgraph-selfhosted.postgresSecretName" . }}'
            key: postgres-password
            optional: true
      API_KEY_SECRET:
        valueFrom:
          secretKeyRef:
            name: '{{ include "costgraph-selfhosted.generatedSecretName" . }}'
            key: api-key-secret
      INTEGRATIONS_ENCRYPTION_KEY:
        valueFrom:
          secretKeyRef:
            name: '{{ include "costgraph-selfhosted.generatedSecretName" . }}'
            key: integrations-encryption-key
    readinessProbe:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      httpGet:
        path: /healthz
        port: http
    livenessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 20
      httpGet:
        path: /healthz
        port: http
    volumeMounts:
      tmp:
        mountPath: /tmp
    volumes:
      tmp:
        emptyDir: {}

dashboard:
  enabled: true
  applicationName: costgraph-selfhosted-dashboard
  # Where the browser reaches this deployment's API. Defaults to appBaseURL
  # + /api/v1, which is right when one ingress fronts both; set it when the
  # API is on a different host.
  apiBaseURL: ""
  # Domain for SSO sign-in. Leave empty unless CostGraph has set up SSO for
  # your deployment; setting it otherwise shows a sign-in button that cannot
  # complete a login.
  cognitoOAuthDomain: ""
  # Base URL of the CostGraph AI assistant, if you run one. Empty hides the
  # assistant from the dashboard.
  graphAiBaseURL: ""
  rbac:
    enabled: false
    serviceAccount:
      create: false
      name: costgraph-selfhosted
  service:
    ports:
      - name: http
        port: 80
        targetPort: http
        protocol: TCP
  deployment:
    enabled: true
    replicas: 2
    image:
      repository: registry.costgraph.ai/costgraph-dashboard
      tag: sha-2060465
      pullPolicy: IfNotPresent
    imagePullSecrets:
      - name: costgraph-selfhosted-registry
    automountServiceAccountToken: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 101
      fsGroup: 101
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    ports:
      - name: http
        containerPort: 8080
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    env:
      # Rolls the pods when anything they are built from changes; stakater does
      # not template annotations.
      VALUES_HASH:
        value: '{{ toYaml .Values | sha256sum }}'
    readinessProbe:
      enabled: true
      initialDelaySeconds: 3
      periodSeconds: 10
      httpGet:
        path: /config.json
        port: http
    livenessProbe:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 20
      httpGet:
        path: /index.html
        port: http
    volumeMounts:
      runtime-config:
        mountPath: /usr/share/nginx/html/config.json
        subPath: config.json
        readOnly: true
      cache:
        mountPath: /var/cache/nginx
      run:
        mountPath: /var/run
      tmp:
        mountPath: /tmp
    volumes:
      runtime-config:
        configMap:
          name: costgraph-selfhosted-dashboard
      cache:
        emptyDir: {}
      run:
        emptyDir: {}
      tmp:
        emptyDir: {}

# Receives metrics from the CostGraph operator running in your clusters. Turn
# it off only if you are not collecting cluster metrics at all.
ingestionApi:
  enabled: true
  applicationName: costgraph-selfhosted-ingestion-api
  logLevel: info
  # Largest remote_write batch to accept, in bytes. Raise it if clusters with
  # many nodes report bodies rejected as too large.
  maxBodyBytes: 52428800
  rbac:
    enabled: false
    serviceAccount:
      create: false
      name: costgraph-selfhosted
  service:
    ports:
      - name: http
        port: 8080
        targetPort: http
  deployment:
    enabled: true
    replicas: 2
    image:
      repository: registry.costgraph.ai/ingestion-api
      # Versioned separately from the chart, so this is pinned rather than
      # following appVersion.
      tag: sha-5dc610b
      pullPolicy: IfNotPresent
    imagePullSecrets:
      - name: costgraph-selfhosted-registry
    automountServiceAccountToken: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      fsGroup: 10001
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    ports:
      - name: http
        containerPort: 8080
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    env:
      PORT:
        value: "8080"
      LOG_LEVEL:
        value: '{{ .Values.logLevel }}'
      VM_TENANT_HEADER:
        value: X-Scope-OrgID
      VM_WRITE_TIMEOUT:
        value: 10s
      MAX_BODY_BYTES:
        value: '{{ .Values.maxBodyBytes }}'
      AUTH_CACHE_SIZE:
        value: "10000"
      AUTH_CACHE_TTL:
        value: 5m
      AUTH_CACHE_NEGATIVE_TTL:
        value: 5s
      VM_WRITE_URL:
        value: '{{ printf "%s/api/v1/write" (include "costgraph-selfhosted.metricsStoreURL" .) }}'
      VM_SHORT_WRITE_URL:
        value: '{{ printf "%s/api/v1/write" (include "costgraph-selfhosted.metricsStoreURL" .) }}'
      AUTH_DB_URL:
        valueFrom:
          secretKeyRef:
            name: '{{ include "costgraph-selfhosted.postgresSecretName" . }}'
            key: postgres-url
      API_KEY_SECRET:
        valueFrom:
          secretKeyRef:
            name: '{{ include "costgraph-selfhosted.generatedSecretName" . }}'
            key: api-key-secret
      VALUES_HASH:
        value: '{{ toYaml .Values | sha256sum }}'
    volumeMounts:
      tmp:
        mountPath: /tmp
    volumes:
      tmp:
        emptyDir: {}

# Turns the raw samples into the per-workload costs the dashboard shows.
# Without it, metrics arrive but cost breakdowns stay empty.
aggregator:
  enabled: true
  applicationName: costgraph-selfhosted-aggregator
  # Cost dimensions to compute. Turning one off drops it from the dashboard.
  features:
    ENABLE_GPU: "true"
    ENABLE_HPA: "true"
    ENABLE_NETWORK_POLICY: "true"
    ENABLE_EPHEMERAL_STORAGE: "true"
    ENABLE_DISK_IOPS: "true"
  rbac:
    enabled: false
    serviceAccount:
      create: false
      name: costgraph-selfhosted
  service:
    ports:
      - name: http
        port: 8192
        targetPort: http
  deployment:
    enabled: true
    replicas: 1
    strategy:
      type: Recreate
    image:
      repository: registry.costgraph.ai/aggregator
      # Versioned separately from the chart, so this is pinned rather than
      # following appVersion.
      tag: sha-79f4b08
      pullPolicy: IfNotPresent
    imagePullSecrets:
      - name: costgraph-selfhosted-registry
    automountServiceAccountToken: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      fsGroup: 10001
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    ports:
      - name: http
        containerPort: 8192
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 2Gi
    env:
      ENVIRONMENT:
        value: production
      RULES_EVAL_INTERVAL:
        value: "1m"
      GOMEMLIMIT:
        value: 1750MiB
      DATABASE_URL:
        valueFrom:
          secretKeyRef:
            name: '{{ include "costgraph-selfhosted.postgresSecretName" . }}'
            key: postgres-url
      # The chart's own helpers resolve here: their values live under global and
      # fullname is fixed, so a subchart can call them.
      REDIS_URL:
        valueFrom:
          secretKeyRef:
            name: '{{ include "costgraph-selfhosted.redisSecretName" . }}'
            key: redis-url
      PROMETHEUS_URL:
        value: '{{ include "costgraph-selfhosted.metricsStoreURL" . }}'
      REMOTE_WRITE_URL:
        value: '{{ printf "%s/api/v1/write" (include "costgraph-selfhosted.metricsStoreURL" .) }}'
      REMOTE_WRITE_URL_SHORT:
        value: '{{ printf "%s/api/v1/write" (include "costgraph-selfhosted.metricsStoreURL" .) }}'
      ENABLE_GPU:
        value: '{{ .Values.features.ENABLE_GPU }}'
      ENABLE_HPA:
        value: '{{ .Values.features.ENABLE_HPA }}'
      ENABLE_NETWORK_POLICY:
        value: '{{ .Values.features.ENABLE_NETWORK_POLICY }}'
      ENABLE_EPHEMERAL_STORAGE:
        value: '{{ .Values.features.ENABLE_EPHEMERAL_STORAGE }}'
      ENABLE_DISK_IOPS:
        value: '{{ .Values.features.ENABLE_DISK_IOPS }}'
      VALUES_HASH:
        value: '{{ toYaml .Values | sha256sum }}'
    volumeMounts:
      tmp:
        mountPath: /tmp
    volumes:
      tmp:
        emptyDir: {}

# Evaluates the recording rules the cost maths reads. Two Deployments, one per
# rule set: long-window rules feed the daily rollups, short-window rules the
# recent views. The rules themselves come from the aggregator image.
vmalert:
  enabled: true
  applicationName: costgraph-selfhosted-vmalert
  deployment:
    enabled: true
    replicas: 1
    image:
      repository: victoriametrics/vmalert
      tag: v1.130.0
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      fsGroup: 10001
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]

# The bundled Redis, Postgres and VictoriaMetrics below are switched on by
# global.<name>.bundled.enabled rather than by an enabled key of their own: the
# components that build connection URLs are subcharts, and a subchart can only
# read global. Everything about their shape lives here, like every other
# component.
redis:
  applicationName: costgraph-selfhosted-redis
  rbac:
    enabled: false
    serviceAccount:
      create: false
      name: costgraph-selfhosted
  service:
    ports:
      - name: redis
        port: 6379
        targetPort: redis
  deployment:
    enabled: true
    replicas: 1
    strategy:
      type: Recreate
    image:
      repository: redis
      tag: 7-alpine
      pullPolicy: IfNotPresent
    # No imagePullSecrets: this one comes from a public registry.
    automountServiceAccountToken: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 999
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    ports:
      - name: redis
        containerPort: 6379
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
    readinessProbe:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 5
      exec:
        command: ["redis-cli", "ping"]
    volumeMounts:
      data:
        mountPath: /data
    volumes:
      data:
        emptyDir: {}

postgres:
  applicationName: costgraph-selfhosted-postgres
  database: costgraph
  username: costgraph
  password: ""                  # generated per-install when empty
  storage: 20Gi
  storageClass: ""
  rbac:
    serviceAccount:
      create: false
      name: costgraph-selfhosted
  service:
    ports:
      - name: postgres
        port: 5432
        targetPort: postgres
  statefulSet:
    enabled: true
    replicas: 1
    containerName: postgres
    image:
      repository: timescale/timescaledb
      tag: 2.17.2-pg17
      pullPolicy: IfNotPresent
    automountServiceAccountToken: false
    securityContext:
      fsGroup: 999
    ports:
      - name: postgres
        containerPort: 5432
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
    env:
      POSTGRES_DB:
        value: '{{ .Values.postgres.database }}'
      POSTGRES_USER:
        value: '{{ .Values.postgres.username }}'
      POSTGRES_PASSWORD:
        valueFrom:
          secretKeyRef:
            name: '{{ include "costgraph-selfhosted.bundledPostgresSecretName" . }}'
            key: password
      # The image initialises into a subdirectory so the PVC's lost+found does
      # not block initdb.
      PGDATA:
        value: /var/lib/postgresql/data/pgdata
    readinessProbe:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 5
      exec:
        command: ["pg_isready", "-U", "{{ .Values.postgres.username }}", "-d", "{{ .Values.postgres.database }}"]
    livenessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 20
      exec:
        command: ["pg_isready", "-U", "{{ .Values.postgres.username }}", "-d", "{{ .Values.postgres.database }}"]
    volumeMounts:
      data:
        mountPath: /var/lib/postgresql/data

victoriametrics:
  applicationName: costgraph-selfhosted-victoria-metrics
  retentionPeriod: "12"         # months
  storage: 20Gi
  storageClass: ""
  rbac:
    serviceAccount:
      create: false
      name: costgraph-selfhosted
  service:
    ports:
      - name: http
        port: 8428
        targetPort: http
  statefulSet:
    enabled: true
    replicas: 1
    containerName: victoria-metrics
    image:
      repository: victoriametrics/victoria-metrics
      tag: v1.106.1
      pullPolicy: IfNotPresent
    automountServiceAccountToken: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 1000
    args:
      - --storageDataPath=/storage
      - --retentionPeriod={{ .Values.victoriametrics.retentionPeriod }}
    ports:
      - name: http
        containerPort: 8428
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
    readinessProbe:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 10
      httpGet:
        path: /health
        port: http
    volumeMounts:
      storage:
        mountPath: /storage

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

# A preflight job that runs before install and upgrade and fails the release
# with the real reason if the database cannot support the schema. Turn it off
# if the database is provisioned after the release.
doctor:
  enabled: true

# Shared by the components rendered from stakater's application chart. A
# subchart sees only global, so anything more than one of them reads lives here.
global:
  postgres:
    url: ""
    password: ""

    # Name of a Secret you manage holding keys `postgres-url` and
    # `postgres-password`. Takes precedence over url/password above.
    existingSecret: ""

    # Apply pending database migrations on start. Leave on unless you apply
    # them yourself as a separate step.
    runMigrations: true
    bundled:
      # Run the Postgres described by the `postgres` component above.
      enabled: false
  metricsStore:
    url: ""                       # http://victoria-metrics:8428
    bundled:
      # Run the VictoriaMetrics described by the `victoriametrics` component.
      enabled: false
  redis:
    url: ""                       # redis://host:6379
    # Name of a Secret you manage holding the URL under `redis-url`. Use it
    # instead of url when the URL carries a password.
    existingSecret: ""
    bundled:
      # Run the Redis described by the `redis` component above.
      enabled: false
  controlPlane:
    url: https://api.costgraph.ai

    # Issued during onboarding. Create it at
    # https://app.costgraph.ai/settings/account/api-keys
    # For production use existingSecret instead, so the key
    # is not stored in values or in Helm release history.
    apiKey: ""

    # Name of a Secret you manage, holding the key under `control-plane-api-key`
    # and under `pricing-api-key` - copy the same key into both unless you were
    # issued a separate pricing key. Takes precedence over apiKey, so nothing
    # sensitive is stored in values or Helm history.
    existingSecret: ""

    # CostGraph's published public key, already filled in. It is not a secret,
    # so keep it here rather than moving it into a Secret. Do not remove it;
    # replace it only if CostGraph tells you it has rotated.
    configPublicKey: |
      -----BEGIN PUBLIC KEY-----
      MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA2Q3ybjZNauw2OH0cthLK
      53yTGgosHHE3lnvAkyd7+xn5EVEwvE1g3fkGQOF0j3aXo4yxPj6ez3kIaNLu4bn1
      JE7M4XV20PhUhjhQ54wDjgqthJYkbctJCtVvg2VT98OCp4tl9ScyZhk5voCYtm7d
      HvZsMczkQUFSaEk/pdWVSrb6G8HZjBptZRhZxfkodSRqLU1rN8KfjpNXP+o+N2Os
      1j54yXjUfH1cKe7nbJDGVpZjnjbOBj/4VY0o9XlJvClAv0FSVxUNH8mZ+wvDR002
      8sszjtvShB2bPTOdHr6cEfRNHcZsrewAt16Jzl3Dsbg4DNv5hQSgpQtJ8wpjs53/
      RQIDAQAB
      -----END PUBLIC KEY-----
  # The URL your users open CostGraph on. Must be the address people actually
  # reach in a browser, not an internal Service DNS name. Also the default
  # allowed browser origin.
  appBaseURL: ""
  # Browser origins allowed to call the API. Defaults to appBaseURL. Set it when
  # the dashboard is served from a different origin, or to allow more than one
  # (comma-separated).
  corsAllowedOrigins: ""
  # Key used to download the pricing catalog. Leave empty to reuse
  # controlPlane.apiKey, which is what most installs do. Set it only if
  # CostGraph issued you a separate key for pricing.
  pricingApiKey: ""
  # Sends CostGraph anonymous product analytics: which features are used, and
  # where people get stuck. No personal data is sent to us. It is how we know
  # what to improve for the people running CostGraph themselves.
  #
  # Set enabled: false to send nothing.
  analytics:
    enabled: true
  # Leave empty and the chart creates the pull secret from controlPlane.apiKey,
  # since the registry authenticates with that same key. Set it to a secret you
  # created yourself if you use controlPlane.existingSecret - a chart cannot read
  # a Secret to build one - and point every component's
  # deployment.imagePullSecrets at it too.
  #
  #   kubectl create secret docker-registry costgraph-registry \
  #     --namespace costgraph \
  #     --docker-server=registry.costgraph.ai \
  #     --docker-username=x \
  #     --docker-password=<your deployment API key>
  imagePullSecrets: []
  # Applied to the pre-install/pre-upgrade Jobs, which are not components and
  # have no block of their own.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
