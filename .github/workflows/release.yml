name: Release Charts

on:
  push:
    branches:
      - main

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Add Helm Dependency Repositories
        run: |
          set -euo pipefail
          for chart in charts/*/Chart.yaml; do
            [ -f "$chart" ] || continue
            yq eval -r '.dependencies[]?.repository // ""' "$chart" | while read -r repo_url; do
              case "$repo_url" in
                http://*|https://*) ;;
                *) continue ;;
              esac
              repo_name=$(printf '%s' "$repo_url" | sed -E -e 's|^https?://||' -e 's|/+$||' -e 's|[/.]|-|g')
              echo "Adding repository: $repo_name -> $repo_url"
              helm repo add "$repo_name" "$repo_url"
            done
          done
          helm repo update

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          packages_with_index: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
