{{- if or .Values.costgraph.apiKey .Values.costgraph.connectionId }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.focusExporter.applicationName }}-costgraph
type: Opaque
stringData:
  COSTGRAPH_URL: {{ .Values.costgraph.url | quote }}
  COSTGRAPH_API_KEY: {{ required "costgraph.apiKey is required, or create the focus-exporter-costgraph Secret yourself" .Values.costgraph.apiKey | quote }}
  COSTGRAPH_CONNECTION_ID: {{ required "costgraph.connectionId is required, or create the focus-exporter-costgraph Secret yourself" .Values.costgraph.connectionId | quote }}
{{- end }}
{{- if .Values.credentials }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.focusExporter.applicationName }}-credentials
type: Opaque
stringData:
  {{- range $key, $value := .Values.credentials }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- if .Values.imagePullSecret.apiKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.focusExporter.applicationName }}-registry
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"registry.costgraph.ai\":{\"username\":\"x\",\"password\":%q,\"auth\":%q}}}" .Values.imagePullSecret.apiKey (printf "x:%s" .Values.imagePullSecret.apiKey | b64enc) | b64enc }}
{{- end }}
