groups:
  - name: baseline_disk_iops_windows
    interval: 30m
    rules:

      # ── container_disk_read_iops — 24h stats + :last (no trends) ──────────────
      - record: costgraph:container_disk_read_iops:mean24h
        expr: avg_over_time(costgraph:container_disk_read_iops:rate5m[24h:5m])
      - record: costgraph:container_disk_read_iops:stddev24h
        expr: stddev_over_time(costgraph:container_disk_read_iops:rate5m[24h:5m])
      - record: costgraph:container_disk_read_iops:min24h
        expr: min_over_time(costgraph:container_disk_read_iops:rate5m[24h:5m])
      - record: costgraph:container_disk_read_iops:max24h
        expr: max_over_time(costgraph:container_disk_read_iops:rate5m[24h:5m])
      - record: costgraph:container_disk_read_iops:p50_24h
        expr: quantile_over_time(0.50, costgraph:container_disk_read_iops:rate5m[24h:5m])
      - record: costgraph:container_disk_read_iops:p90_24h
        expr: quantile_over_time(0.90, costgraph:container_disk_read_iops:rate5m[24h:5m])
      - record: costgraph:container_disk_read_iops:p95_24h
        expr: quantile_over_time(0.95, costgraph:container_disk_read_iops:rate5m[24h:5m])
      - record: costgraph:container_disk_read_iops:p99_24h
        expr: quantile_over_time(0.99, costgraph:container_disk_read_iops:rate5m[24h:5m])
      - record: costgraph:container_disk_read_iops:last
        expr: costgraph:container_disk_read_iops:rate5m > 0

