# Default values for costgraph-operator.

# Global configuration shared across all operator components.
global:
  clusterName: ""
  # apiKey is used to create a Secret when existingSecret is not set.
  # Do not commit a real key here; prefer existingSecret in production.
  apiKey: ""
  # existingSecret: name of a pre-existing Secret that contains the API key.
  # When set, no Secret is created by this chart and apiKey is ignored.
  existingSecret: ""
  # existingSecretKey: key within existingSecret that holds the API key value.
  # Defaults to "apiKey" when not specified.
  existingSecretKey: ""
  # backendURL is the base URL of the Costgraph API. Leave empty to omit the
  # BACKEND_URL env var and rely on the service's built-in default.
  backendURL: "https://api.costgraph.ai"
  namespace: "costgraph"
  # Flag to enable use of our custom image in the cadvisor chart
  security:
    allowInsecureImages: true

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# --------------------------------------------------------------------------
# rbac
#
# The operator reads what its ClusterRole allows and nothing else: resources it
# cannot list are skipped at startup. This role is therefore the whole data
# collection policy, and it is the only place to change what CostGraph sees.
#
# Built-in resources are granted by name; custom resources are granted per API
# group, discovered from the cluster when the chart renders. Kubernetes RBAC is
# an allowlist with no deny rule, so every setting here is applied by Helm at
# render time and none of it appears in the ClusterRole.
# --------------------------------------------------------------------------
rbac:
  # grantCustomResources: read custom resources in every discovered API group
  # that excludeAPIGroups does not name. Set false to collect built-in
  # resources only.
  grantCustomResources: true

  # requireClusterDiscovery: fail the render when no custom resource API group
  # is found, which means the chart was rendered without cluster access and
  # would silently collect nothing beyond core Kubernetes. Only applies when
  # grantCustomResources is true, since nothing depends on discovery otherwise.
  # Set false only for a cluster that genuinely has no CRDs.
  requireClusterDiscovery: true

  # excludeAPIGroups: dropped from the custom-resource grant, at every API
  # version. The default policy, not a ceiling: extraRules can grant back a
  # named resource from an excluded group.
  excludeAPIGroups:
    # Credential material, or the references and backend auth config for it.
    - acme.cert-manager.io
    - authentication.k8s.io
    - authorization.k8s.io
    - cert-manager.io
    - certificates.k8s.io
    - external-secrets.io
    - generators.external-secrets.io
    - helm.toolkit.fluxcd.io
    - notification.toolkit.fluxcd.io
    - rbac.authorization.k8s.io
    - traefik.io
    - velero.io
    # Cluster machinery: no cost or topology signal, high row churn.
    - admissionregistration.k8s.io
    - apiextensions.k8s.io
    - apiregistration.k8s.io
    - coordination.k8s.io
    - events.k8s.io
    - flowcontrol.apiserver.k8s.io
    - internal.apiserver.k8s.io
    - longhorn.io
    - metrics.k8s.io
    # node.k8s.io is RuntimeClass, not Nodes. Nodes are core/v1 and granted.
    - node.k8s.io
    - scheduling.k8s.io
    - storagemigration.k8s.io

  # extraRules: appended to the ClusterRole verbatim. Excluding a group excludes
  # it whole, so name individual resources here to grant them back. See the
  # RBAC section of README.md for a worked example.
  extraRules: []

# --------------------------------------------------------------------------
# kube-state-metrics (subchart from prometheus-community)
# See: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-state-metrics
# --------------------------------------------------------------------------
kube-state-metrics:
  enabled: true
  # The subchart generates its ClusterRole from this list, so a resource left
  # out is never granted. Trimmed from the upstream default: secrets,
  # configmaps, certificatesigningrequests, leases and the webhook
  # configurations. CostGraph consumes none of their series, and the upstream
  # default would otherwise grant the metrics agent read access to every Secret
  # in the cluster in order to emit metadata we never use.
  collectors:
    - cronjobs
    - daemonsets
    - deployments
    - endpoints
    - horizontalpodautoscalers
    - ingresses
    - jobs
    - limitranges
    - namespaces
    - networkpolicies
    - nodes
    - persistentvolumeclaims
    - persistentvolumes
    - poddisruptionbudgets
    - pods
    - replicasets
    - replicationcontrollers
    - resourcequotas
    - services
    - statefulsets
    - storageclasses
    - volumeattachments

# --------------------------------------------------------------------------
# cadvisor (subchart from bitnami)
# See: https://github.com/bitnami/charts/tree/main/bitnami/cadvisor
# --------------------------------------------------------------------------
cadvisor:
  enabled: true
  image:
    registry: ghcr.io
    repository: baselinehq/cadvisor
    tag: "0.56.3-baseline"
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  tolerations:
    - operator: Exists


# --------------------------------------------------------------------------
# aiGatewayScraper
#
# A second instance of the operator scraper, dedicated to AI gateway metrics.
# It exists as its own deployment for one reason: remoteWritePath is
# per-deployment, and raw gateway series are high cardinality, so they belong in
# the short-retention tier rather than the 90-day one. flowtrace does the same.
#
# It takes no scrapeTargets. Gateway targets are served by CostGraph from the
# connections you create in Settings -> Integrations, fetched at start and
# refreshed while it runs, so connecting a gateway never edits these values.
# --------------------------------------------------------------------------
aiGatewayScraper:
  enabled: false
  image:
    repository: ghcr.io/baselinehq/costgraph-operator-prometheus
    tag: "v0.4.0"
    pullPolicy: IfNotPresent
  config:
    remoteWriteURL: "https://tsdb.costgraph.ai"
    remoteWritePath: "/api/v1/write/short"
    httpTimeout: "30s"
  securityContext: {}
  resources: {}
  nodeSelector: {}
  tolerations: []

# --------------------------------------------------------------------------
# dcgm-exporter (subchart from NVIDIA)
# See: https://github.com/NVIDIA/dcgm-exporter/tree/main/deployment/chart
# Enable this when GPU nodes are present in the cluster. The exporter runs
# as a DaemonSet on GPU nodes and exposes DCGM metrics for Prometheus.
# --------------------------------------------------------------------------
dcgm-exporter:
  enabled: false
  serviceMonitor:
    # Set to true if you have the Prometheus Operator installed and want
    # automatic scrape config generated.
    enabled: false
  # Restrict the DaemonSet to GPU nodes only.
  nodeSelector:
    accelerator: nvidia
  # GPU nodes are commonly tainted — add matching tolerations here.
  tolerations: []
  # Example toleration for the standard NVIDIA GPU taint:
  # tolerations:
  #   - key: nvidia.com/gpu
  #     operator: Exists
  #     effect: NoSchedule
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  podAnnotations: {}
  podLabels: {}

# --------------------------------------------------------------------------
# prometheus-node-exporter (subchart from prometheus-community)
# See: https://github.com/prometheus-community/helm-charts/tree/main/charts/prometheus-node-exporter
# Runs as a DaemonSet exposing host-level metrics (CPU, memory, disk, network)
# on port 9100 at /metrics.
# --------------------------------------------------------------------------
prometheus-node-exporter:
  enabled: true
  # Defaults to 9101 because the subchart binds hostPort, so the upstream
  # default of 9100 collides with a node exporter the cluster already runs.
  # The operator scrape target follows this port, so set it here only.
  service:
    port: 9101
    targetPort: 9101
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  tolerations:
    - operator: Exists
  podAnnotations: {}
  podLabels: {}

# --------------------------------------------------------------------------
# costgraph-operator-kubernetes deployment
# --------------------------------------------------------------------------
operatorKubernetes:
  enabled: true
  image:
    repository: ghcr.io/baselinehq/costgraph-operator-kubernetes
    tag: "v0.1.0"
    pullPolicy: IfNotPresent
  # This should always be 1
  replicas: 1
  config:
    operatorVersion: "1.0.0"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  env: []

# --------------------------------------------------------------------------
# costgraph-operator-prometheus deployment
# --------------------------------------------------------------------------
operatorPrometheus:
  enabled: true
  image:
    repository: ghcr.io/baselinehq/costgraph-operator-prometheus
    tag: "v0.4.0"
    pullPolicy: IfNotPresent
  # This should always be 1
  replicas: 1
  config:
    remoteWriteURL: "https://tsdb.costgraph.ai"
    remoteWritePath: "/api/v1/write"
    prometheusAPIProvider: "prometheus"
    prometheusAPIVersion: "kube-state-metrics"
    httpTimeout: "30s"
  # ------------------------------------------------------------------------
  # scrapeTargets: map of in-cluster /metrics endpoints to discover and push
  # to remote write. Adding a new metrics source no longer requires a new
  # operator image — just append an entry here.
  #
  # Map keys are the target names (used in logs). A map (not a list) is used so
  # callers can override individual fields via Helm `--set` without clobbering
  # siblings, e.g.:
  #   --set operatorPrometheus.scrapeTargets.node-exporter.namespace=monitoring
  #
  # Each entry:
  #   kind          (optional) — "pod" (default) or "node".
  #   enabled       (optional) — when false, the entry is omitted. Defaults to true.
  #   path          (optional) — metrics path. Defaults to /metrics.
  #   nodeMetrics   (optional) — true for sources producing node-scoped metrics
  #                              (cAdvisor, node-exporter, dcgm, kubelet). Scraper
  #                              stamps costgraph_instance_hostname and
  #                              costgraph_instance_id when set.
  #   metricNamePrefixes (optional) — list of name prefixes; only families
  #                              matching one are kept. Empty keeps all. Used to
  #                              drop go_*/process_* noise from kubelet /metrics.
  #
  # Pod targets (kind: pod) additionally require:
  #   namespace     (required) — pod namespace
  #   labelSelector (required) — Kubernetes label selector for pod discovery
  #   port          (required) — HTTP port the exporter listens on, 1..65535
  #
  # Node targets (kind: node) ignore namespace/port and scrape each node's
  # kubelet through the API-server proxy (/api/v1/nodes/<n>/proxy/<path>) — the
  # only kubelet path that survives managed-cluster security groups, which block
  # direct cross-node connections. labelSelector is an optional node filter.
  # Requires the chart's ClusterRole grant of nodes + nodes/proxy.
  #
  # Templated as JSON into the SCRAPE_TARGETS env var on the deployment.
  # Helm value keys are camelCase; emitted JSON keys are snake_case
  # (label_selector, node_metrics, metric_name_prefixes) to match the operator
  # config struct tags.
  # ------------------------------------------------------------------------
  scrapeTargets:
    cadvisor:
      enabled: true
      namespace: "{{ include \"costgraph-operator.namespace\" . }}"
      labelSelector: "app.kubernetes.io/name=cadvisor"
      port: 8080
      nodeMetrics: true
    kube-state-metrics:
      enabled: true
      namespace: "{{ include \"costgraph-operator.namespace\" . }}"
      labelSelector: "app.kubernetes.io/name=kube-state-metrics"
      port: 8080
    dcgm-exporter:
      enabled: false
      namespace: "{{ include \"costgraph-operator.namespace\" . }}"
      labelSelector: "app.kubernetes.io/name=dcgm-exporter"
      port: 9400
      nodeMetrics: true
    node-exporter:
      enabled: true
      namespace: "{{ include \"costgraph-operator.namespace\" . }}"
      labelSelector: "app.kubernetes.io/name=prometheus-node-exporter"
      port: '{{ index .Values "prometheus-node-exporter" "service" "port" }}'
      nodeMetrics: true
    kubelet:
      enabled: true
      kind: node
      path: /metrics
      nodeMetrics: true
      metricNamePrefixes:
        - kubelet_
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  env: []
# --------------------------------------------------------------------------
# costgraph flowtrace daemonset (eBPF network flow tracing)
# Runs the flowtrace binary from the costgraph-operator-prometheus image on
# every node. Two node requirements, both checked at startup and refused rather
# than run degraded, so an unsuitable node CrashLoopBackOffs:
#   - a BTF-enabled kernel (CONFIG_DEBUG_INFO_BTF) for the fentry programs.
#   - a cgroup v2 hierarchy for container attribution. Cgroup ids come from the
#     default (v2) hierarchy, so on a v1-only node every socket reports the v2
#     root and the whole node collapses to a single identity.
# Gate with nodeSelector if the fleet is mixed.
# --------------------------------------------------------------------------
flowtrace:
  enabled: true
  image:
    repository: ghcr.io/baselinehq/costgraph-operator-prometheus
    tag: "v0.4.0"
    pullPolicy: IfNotPresent
  config:
    remoteWriteURL: "https://tsdb.costgraph.ai"
    # Short-retention tier: flow series are high cardinality and are not
    # intended to live as long as the operator's scraped metrics.
    remoteWritePath: "/api/v1/write/short"
    # Must stay aligned with the collector's 15m flowSeriesTTL.
    pushInterval: "4m"
    # When false, flows whose container cannot be resolved (host/node
    # processes) are dropped.
    includeHostFlows: false
    httpTimeout: "30s"
  # Raise on large fleets to speed up rollouts, e.g. "10%".
  maxUnavailable: 1
  # system-node-critical is appropriate here but is namespace-restricted on
  # some clusters — set deliberately rather than by default.
  priorityClassName: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      # No CPU limit: throttling the 15s sampler produces gaps that read as
      # counter stalls. Memory is capped because the accumulator maps scale
      # with flow cardinality.
      memory: 256Mi
  tolerations:
    - operator: Exists
  nodeSelector: {}
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  env: []
