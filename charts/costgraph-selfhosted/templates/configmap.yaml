apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "costgraph-selfhosted.fullname" . }}
  labels:
    {{- include "costgraph-selfhosted.labels" . | nindent 4 }}
data:
  DEPLOYMENT_MODE: "on_prem"
  DEPLOYMENT_NAME: {{ .Values.deploymentName | default .Release.Name | quote }}

  CONTROL_PLANE_URL: {{ .Values.controlPlane.url | quote }}
  DEPLOYMENT_CONFIG_PUBLIC_KEY: {{ .Values.controlPlane.configPublicKey | quote }}

  {{- /*
  Optional: CostGraph owns the user pool and provisions this deployment's app
  client, and both reach the deployment in the signed config document. Set
  them only to pin a pool explicitly.
  */}}
  {{- with (.Values.cognito).region }}
  COGNITO_REGION: {{ . | quote }}
  {{- end }}
  {{- with (.Values.cognito).userPoolId }}
  COGNITO_USER_POOL_ID: {{ . | quote }}
  {{- end }}
  {{- with (.Values.cognito).userPoolClientId }}
  AUTH_AUDIENCE: {{ . | quote }}
  {{- end }}
  {{- with (.Values.cognito).jwksURL }}
  COGNITO_JWKS_URL: {{ . | quote }}
  {{- end }}

  APP_BASE_URL: {{ .Values.appBaseURL | quote }}
  AUTH_PROVIDER_NAME: "cognito"

  BILLING_MODE: {{ .Values.capabilities.billingMode | quote }}
  EMAIL_PROVIDER: {{ .Values.capabilities.emailProvider | quote }}
  PRICING_SOURCE: {{ .Values.capabilities.pricingSource | quote }}
  PRICING_SYNC_INTERVAL: {{ .Values.capabilities.pricingSyncInterval | quote }}
  METERING_PUSH_INTERVAL: {{ .Values.capabilities.meteringPushInterval | quote }}

  MIGRATE: {{ if .Values.postgres.runMigrations }}"1"{{ else }}"0"{{ end }}
  {{- if not .Values.redis.existingSecret }}
  {{- with (include "costgraph-selfhosted.redisURL" .) }}
  REDIS_URL: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- with (include "costgraph-selfhosted.metricsStoreURL" .) }}
  METRICS_STORE_URL: {{ . | quote }}
  {{- end }}

  {{- if .Values.analytics.enabled }}
  POSTHOG_PUBLIC_API_KEY: {{ .Values.analytics.posthogKey | quote }}
  POSTHOG_HOST: {{ .Values.analytics.posthogHost | quote }}
  {{- end }}

  PORT: "8080"
  ENVIRONMENT: "production"
  CORS_ALLOWED_ORIGINS: {{ .Values.corsAllowedOrigins | default .Values.appBaseURL | quote }}
