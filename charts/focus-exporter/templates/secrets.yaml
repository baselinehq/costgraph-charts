{{- if not .Values.costgraph.existingSecret }}
{{- include "costgraph.secret" (dict
    "ctx" .
    "name" (include "focus-exporter.costgraphSecretName" .)
    "labels" (include "focus-exporter.labels" . | fromYaml)
    "stringData" (dict
      "COSTGRAPH_API_KEY" (required "costgraph.apiKey is required, or set costgraph.existingSecret" .Values.costgraph.apiKey)
      "COSTGRAPH_CONNECTION_ID" (required "costgraph.connectionId is required, or set costgraph.existingSecret" .Values.costgraph.connectionId))
  ) }}
{{- end }}
{{- if and .Values.credentials (not .Values.credentialsExistingSecret) }}
---
{{ include "costgraph.secret" (dict
    "ctx" .
    "name" (include "focus-exporter.credentialsSecretName" .)
    "labels" (include "focus-exporter.labels" . | fromYaml)
    "stringData" .Values.credentials
  ) }}
{{- end }}
{{- if and .Values.imagePullSecret.apiKey (not .Values.imagePullSecret.existingSecret) }}
---
{{ include "costgraph.dockerConfigJsonSecret" (dict
    "ctx" .
    "name" (include "focus-exporter.pullSecretName" .)
    "labels" (include "focus-exporter.labels" . | fromYaml)
    "registry" "registry.costgraph.ai"
    "password" .Values.imagePullSecret.apiKey
  ) }}
{{- end }}
