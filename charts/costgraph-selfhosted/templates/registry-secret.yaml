{{- if and .Values.controlPlane.apiKey (not .Values.imagePullSecrets) }}
{{/*
The registry authenticates with the deployment API key, so when that key is in
values there is no second credential to create: the chart builds the pull
secret from it.

Not generated when controlPlane.existingSecret is used instead - a Helm
template cannot read a Secret's contents, so it would produce an empty
password and every pod would fail to pull for no visible reason. Those installs
set imagePullSecrets to a secret they create themselves.
*/}}
{{- $auth := printf "x:%s" .Values.controlPlane.apiKey | b64enc }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "costgraph-selfhosted.fullname" . }}-registry
  labels:
    {{- include "costgraph-selfhosted.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf `{"auths":{%q:{"auth":%q}}}` .Values.image.registry $auth | b64enc }}
{{- end }}
