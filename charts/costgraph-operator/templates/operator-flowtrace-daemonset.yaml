{{- $c := .Values.flowtrace }}
{{- if and $c.enabled $c.daemonSet.enabled }}
{{- $w := $c.daemonSet }}
{{- $name := required "flowtrace.applicationName is required" $c.applicationName }}
{{- $component := "flowtrace" }}
{{- $labels := fromYaml (include "costgraph-operator.componentLabels" (dict "ctx" $ "name" $name "component" $component)) }}
{{- /*
Host filesystem mount points. Each is referenced twice - once as a volumeMount
path and once as the env var the binary reads it from - and a mismatch between
the two fails silently (an empty walk, not an error), so they are bound once
here rather than repeated as literals.
*/}}
{{- $procMount := "/host/proc" }}
{{- $cgroupMount := "/host/sys/fs/cgroup" }}
{{- $env := dict
    "NODE_NAME"         (dict "valueFrom" (dict "fieldRef" (dict "fieldPath" "spec.nodeName")))
    "CLUSTER_NAME"      (dict "value" (required "Cluster name must be provided" .Values.global.clusterName))
    "API_KEY"           (dict "valueFrom" (dict "secretKeyRef" (dict "name" (include "costgraph-operator.apiKeySecretName" .) "key" (include "costgraph-operator.apiKeySecretKey" .))))
    "REMOTE_WRITE_URL"  (dict "value" (include "costgraph-operator.remoteWriteURL" (dict "component" $c.config.remoteWriteURL "root" $)))
    "REMOTE_WRITE_PATH" (dict "value" $c.config.remoteWritePath)
    "FLOWTRACE_PUSH_INTERVAL"     (dict "value" $c.config.pushInterval)
    "FLOWTRACE_INCLUDE_HOST_FLOWS" (dict "value" $c.config.includeHostFlows)
    "HTTP_TIMEOUT"      (dict "value" $c.config.httpTimeout)
    "PROC_FS_PATH"      (dict "value" $procMount)
    "HOST_CGROUP_FS"    (dict "value" $cgroupMount)
}}
{{- with .Values.global.backendURL }}{{- $_ := set $env "BACKEND_URL" (dict "value" .) }}{{- end }}
{{- $env = mergeOverwrite $env (deepCopy ($w.env | default dict)) }}
{{- $args := dict
    "ctx"                      $
    "kind"                     "DaemonSet"
    "name"                     $name
    "containerName"            $component
    "labels"                   $labels
    "selectorLabels"           (fromYaml (include "costgraph-operator.componentSelectorLabels" (dict "ctx" $ "name" $name "component" $component)))
    "podLabels"                (merge (deepCopy ($w.podLabels | default dict)) (deepCopy $labels))
    "podAnnotations"           $w.podAnnotations
    "strategy"                 (dict "type" "RollingUpdate" "rollingUpdate" (dict "maxUnavailable" $c.maxUnavailable))
    "image"                    (include "costgraph.imageRef" $w.image)
    "imagePullPolicy"          $w.image.pullPolicy
    "imagePullSecrets"         ($w.imagePullSecrets | default .Values.imagePullSecrets)
    "command"                  (list "/costgraph_operator_flowtrace")
    "priorityClassName"        $w.priorityClassName
    "terminationGracePeriodSeconds" 30
    "podSecurityContext"       $w.podSecurityContext
    "containerSecurityContext" $w.containerSecurityContext
    "resources"                $w.resources
    "ports"                    $w.ports
    "env"                      (fromYamlArray (include "costgraph-operator.env" (dict "ctx" $ "env" $env)))
    "volumeMounts"             (list
        (dict "name" "proc" "mountPath" $procMount "readOnly" true)
        (dict "name" "cgroup" "mountPath" $cgroupMount "readOnly" true "mountPropagation" "HostToContainer"))
    "volumes"                  (list
        (dict "name" "proc" "hostPath" (dict "path" "/proc" "type" "Directory"))
        (dict "name" "cgroup" "hostPath" (dict "path" "/sys/fs/cgroup" "type" "Directory")))
    "nodeSelector"             $w.nodeSelector
    "tolerations"              $w.tolerations
    "affinity"                 $w.affinity
}}
{{- /*
No serviceAccountName and no token: the node name arrives via the downward API,
cluster/tenant/instance ids come from the Costgraph backend over HTTPS, and
container identity is resolved by matching each flow's cgroup id against the
host cgroup filesystem. Withholding the token keeps a privileged per-node pod
off the chart's cluster-wide read ClusterRole.

The cgroup mount needs mountPropagation HostToContainer: hybrid nodes keep the
cgroup2 hierarchy in a separate mount at <root>/unified with tmpfs above it, and
hostPath defaults to None, which hides submounts, so the walk would find an
empty directory and every flow would resolve to no container. Both volumes are
type Directory rather than DirectoryOrCreate because creating an empty mount
point would make a missing cgroupfs look like a node with no containers.
*/}}
{{- if hasKey $w "automountServiceAccountToken" }}{{- $_ := set $args "automountServiceAccountToken" $w.automountServiceAccountToken }}{{- end }}
{{- include "costgraph.workload" $args }}
{{- end }}
