{{- if .Values.dashboard.enabled }}
{{- $fullname := include "costgraph-selfhosted.fullname" . }}
{{- $name := printf "%s-dashboard" $fullname }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "costgraph-selfhosted.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
data:
  config.json: |
    {{- include "costgraph-selfhosted.dashboardConfig" . | nindent 4 }}
{{- end }}
