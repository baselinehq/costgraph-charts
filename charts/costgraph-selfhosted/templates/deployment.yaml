{{- include "costgraph-selfhosted.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "costgraph-selfhosted.fullname" . }}
  labels:
    {{- include "costgraph-selfhosted.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "costgraph-selfhosted.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "costgraph-selfhosted.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      {{- with include "costgraph-selfhosted.imagePullSecrets" . }}
      imagePullSecrets:
        {{- . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "costgraph-selfhosted.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: backend
          image: {{ include "costgraph-selfhosted.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "costgraph-selfhosted.fullname" . }}
          env:
            - name: CONTROL_PLANE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "costgraph-selfhosted.secretName" . }}
                  key: control-plane-api-key
            # pricingapi accepts the same CostGraph API key, so the deployment
            # key serves for both unless one is supplied explicitly.
            {{- if .Values.redis.existingSecret }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.existingSecret }}
                  key: redis-url
            {{- end }}
            - name: PRICING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "costgraph-selfhosted.secretName" . }}
                  key: {{ if .Values.pricingApiKey }}pricing-api-key{{ else }}control-plane-api-key{{ end }}
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "costgraph-selfhosted.postgresSecretName" . }}
                  key: postgres-url
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "costgraph-selfhosted.postgresSecretName" . }}
                  key: postgres-password
                  optional: true
            - name: API_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "costgraph-selfhosted.fullname" . }}-generated
                  key: api-key-secret
            - name: INTEGRATIONS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "costgraph-selfhosted.fullname" . }}-generated
                  key: integrations-encryption-key
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
