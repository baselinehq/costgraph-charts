apiVersion: v2
name: costgraph-selfhosted
description: CostGraph running in your own infrastructure
type: application
version: 0.5.0
appVersion: "0.1.0"
home: https://costgraph.ai
sources:
  - https://github.com/baselinehq/backend
maintainers:
  - name: Baseline
    url: https://baselinehq.cloud
dependencies:
  - name: application
    version: 9.3.1
    repository: https://stakater.github.io/stakater-charts
    alias: redis
    # The bundled datastores are opt-in, and the flag lives under global
    # because the subcharts that build connection URLs can only read global.
    condition: global.redis.bundled.enabled
  - name: application
    version: 9.3.1
    repository: https://stakater.github.io/stakater-charts
    alias: aggregator
    condition: aggregator.enabled
  - name: application
    version: 9.3.1
    repository: https://stakater.github.io/stakater-charts
    alias: ingestionApi
    condition: ingestionApi.enabled
  - name: application
    version: 9.3.1
    repository: https://stakater.github.io/stakater-charts
    alias: dashboard
    condition: dashboard.enabled
  - name: application
    version: 9.3.1
    repository: https://stakater.github.io/stakater-charts
    alias: backend
    condition: backend.enabled
  - name: costgraph-common
    version: "*"
    repository: file://../costgraph-common
