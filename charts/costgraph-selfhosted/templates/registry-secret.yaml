{{- if and .Values.controlPlane.apiKey (not .Values.imagePullSecrets) }}
{{- $auth := printf "x:%s" .Values.controlPlane.apiKey | b64enc }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "costgraph-selfhosted.fullname" . }}-registry
  labels:
    {{- include "costgraph-selfhosted.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf `{"auths":{%q:{"auth":%q}}}` (.Values.image.registry | required "image.registry is required: it is the host the pull secret authenticates against, and an empty one produces a secret kubelet cannot match") $auth | b64enc }}
{{- end }}
