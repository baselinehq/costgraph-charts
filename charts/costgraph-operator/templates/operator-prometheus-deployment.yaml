{{- $c := .Values.operatorPrometheus }}
{{- if and $c.enabled $c.deployment.enabled }}
{{- $w := $c.deployment }}
{{- $name := required "operatorPrometheus.applicationName is required" $c.applicationName }}
{{- $component := "operator-prometheus" }}
{{- $labels := fromYaml (include "costgraph-operator.componentLabels" (dict "ctx" $ "name" $name "component" $component)) }}
{{- $env := dict
    "CLUSTER_NAME"          (dict "value" (required "Cluster name must be provided" .Values.global.clusterName))
    "API_KEY"               (dict "valueFrom" (dict "secretKeyRef" (dict "name" (include "costgraph-operator.apiKeySecretName" .) "key" (include "costgraph-operator.apiKeySecretKey" .))))
    "PROMETHEUS_URL"        (dict "value" (printf "%s-kube-state-metrics.%s.svc.cluster.local:8080" .Release.Name (include "costgraph-operator.namespace" .)))
    "REMOTE_WRITE_URL"      (dict "value" (include "costgraph-operator.remoteWriteURL" (dict "component" $c.config.remoteWriteURL "root" $)))
    "REMOTE_WRITE_PATH"     (dict "value" $c.config.remoteWritePath)
    "PROMETHEUS_API_PROVIDER" (dict "value" $c.config.prometheusAPIProvider)
    "PROMETHEUS_API_VERSION"  (dict "value" $c.config.prometheusAPIVersion)
    "HTTP_TIMEOUT"          (dict "value" $c.config.httpTimeout)
    "SCRAPE_TARGETS"        (dict "value" (include "costgraph-operator.scrapeTargets" (dict "ctx" $ "targets" $c.scrapeTargets)))
}}
{{- with .Values.global.backendURL }}{{- $_ := set $env "BACKEND_URL" (dict "value" .) }}{{- end }}
{{- $env = mergeOverwrite $env (deepCopy ($w.env | default dict)) }}
{{- $args := dict
    "ctx"                      $
    "kind"                     "Deployment"
    "name"                     $name
    "containerName"            $component
    "labels"                   $labels
    "selectorLabels"           (fromYaml (include "costgraph-operator.componentSelectorLabels" (dict "ctx" $ "name" $name "component" $component)))
    "podLabels"                (merge (deepCopy ($w.podLabels | default dict)) (deepCopy $labels))
    "podAnnotations"           $w.podAnnotations
    "replicas"                 $w.replicas
    "image"                    (include "costgraph.imageRef" $w.image)
    "imagePullPolicy"          $w.image.pullPolicy
    "imagePullSecrets"         ($w.imagePullSecrets | default .Values.imagePullSecrets)
    "serviceAccountName"       (include "costgraph-operator.serviceAccountName" .)
    "podSecurityContext"       $w.podSecurityContext
    "containerSecurityContext" $w.containerSecurityContext
    "resources"                $w.resources
    "ports"                    $w.ports
    "env"                      (fromYamlArray (include "costgraph-operator.env" (dict "ctx" $ "env" $env)))
    "nodeSelector"             $w.nodeSelector
    "tolerations"              $w.tolerations
    "affinity"                 $w.affinity
}}
{{- if hasKey $w "automountServiceAccountToken" }}{{- $_ := set $args "automountServiceAccountToken" $w.automountServiceAccountToken }}{{- end }}
{{- include "costgraph.workload" $args }}
{{- end }}
