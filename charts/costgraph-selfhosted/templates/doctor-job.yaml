{{- /*
Upgrades only. On a first install the database is empty by definition, and the
schema checks read that as broken - no goose_db_version table, no citext or
pg_trgm, since the migrations that create them have never run. Preflighting an
install therefore failed every install it was meant to protect.

Also skipped with postgres.bundled.enabled: nothing outside the release owns
that database, so there is no schema to preflight that this release did not
just create itself.
*/ -}}
{{- if and .Values.doctor.enabled (not .Values.postgres.bundled.enabled) }}
{{- /*
The release's own ConfigMap and Secret do not exist yet when a pre-install
hook runs, so the check carries its own copy of the only thing it needs: the
database credentials. Reading them from the release Secret left the hook pod
in CreateContainerConfigError until the install timed out, with no logs to
explain it. A customer-managed Secret is already there, so it is used as is.
*/}}
{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "costgraph-selfhosted.fullname" . }}-doctor
  labels:
    {{- include "costgraph-selfhosted.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
type: Opaque
stringData:
  postgres-url: {{ .Values.postgres.url | quote }}
  postgres-password: {{ .Values.postgres.password | quote }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "costgraph-selfhosted.fullname" . }}-doctor
  labels:
    {{- include "costgraph-selfhosted.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "costgraph-selfhosted.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: doctor
    spec:
      restartPolicy: Never
      {{- with include "costgraph-selfhosted.imagePullSecrets" . }}
      imagePullSecrets:
        {{- . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: doctor
          image: {{ include "costgraph-selfhosted.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["/usr/local/bin/selfhost-doctor", "-offline"]
          {{- $secret := .Values.postgres.existingSecret | default (printf "%s-doctor" (include "costgraph-selfhosted.fullname" .)) }}
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: postgres-url
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: postgres-password
                  optional: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
