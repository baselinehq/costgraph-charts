{{- if .Values.aiGatewayScraper.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "costgraph-operator.aiGatewayScraperName" . }}
  namespace: {{ include "costgraph-operator.namespace" . }}
  labels:
    {{- include "costgraph-operator.aiGatewayScraperLabels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "costgraph-operator.aiGatewayScraperSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.aiGatewayScraper.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "costgraph-operator.aiGatewayScraperLabels" . | nindent 8 }}
        {{- with .Values.aiGatewayScraper.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "costgraph-operator.serviceAccountName" . }}
      {{- with .Values.aiGatewayScraper.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: operator-ai-gateway
          image: "{{ .Values.aiGatewayScraper.image.repository }}:{{ .Values.aiGatewayScraper.image.tag }}"
          imagePullPolicy: {{ .Values.aiGatewayScraper.image.pullPolicy }}
          env:
            - name: CLUSTER_NAME
              value: {{ .Values.global.clusterName | required "Cluster name must be provided" | quote }}
            {{- with .Values.global.backendURL }}
            - name: BACKEND_URL
              value: {{ . | quote }}
            {{- end }}
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "costgraph-operator.apiKeySecretName" . }}
                  key: {{ include "costgraph-operator.apiKeySecretKey" . }}
            - name: REMOTE_WRITE_URL
              value: {{ include "costgraph-operator.remoteWriteURL" (dict "component" .Values.aiGatewayScraper.config.remoteWriteURL "root" $) | quote }}
            - name: REMOTE_WRITE_PATH
              value: {{ .Values.aiGatewayScraper.config.remoteWritePath | quote }}
            - name: HTTP_TIMEOUT
              value: {{ .Values.aiGatewayScraper.config.httpTimeout | quote }}
            {{- /*
            An empty list, not an absent value: the scraper requires
            SCRAPE_TARGETS to parse, and gateway targets are served by CostGraph
            from the connections the customer created rather than set here, so
            connecting a gateway never edits Helm values. See
            operator-prometheus-deployment.yaml for the statically configured
            scraper.
            */}}
            - name: SCRAPE_TARGETS
              value: "[]"
            {{- with .Values.aiGatewayScraper.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.aiGatewayScraper.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.aiGatewayScraper.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.aiGatewayScraper.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.aiGatewayScraper.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
