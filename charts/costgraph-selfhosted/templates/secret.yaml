{{/*
The control-plane and Postgres credentials are gated separately, so supplying
one through an existingSecret does not stop the other from rendering. Gating
both together left the Deployment referencing a postgres-url key that no
Secret carried, which passes `helm template` and then fails the pod.
*/}}
{{- $needsControlPlane := not .Values.controlPlane.existingSecret }}
{{- $needsPostgres := and (not .Values.postgres.existingSecret) (or .Values.postgres.url (not .Values.postgres.bundled.enabled)) }}
{{- if or $needsControlPlane $needsPostgres }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "costgraph-selfhosted.fullname" . }}
  labels:
    {{- include "costgraph-selfhosted.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $needsControlPlane }}
  control-plane-api-key: {{ .Values.controlPlane.apiKey | quote }}
  {{- with .Values.pricingApiKey }}
  pricing-api-key: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if $needsPostgres }}
  postgres-url: {{ .Values.postgres.url | quote }}
  postgres-password: {{ .Values.postgres.password | quote }}
  {{- end }}
{{- end }}
---
{{- $name := printf "%s-generated" (include "costgraph-selfhosted.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "costgraph-selfhosted.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  api-key-secret: {{ index $existing.data "api-key-secret" }}
  integrations-encryption-key: {{ index $existing.data "integrations-encryption-key" }}
  {{- else }}
  api-key-secret: {{ randAlphaNum 48 | b64enc | quote }}
  # Must decode to exactly 32 bytes.
  integrations-encryption-key: {{ randAlphaNum 32 | b64enc | b64enc | quote }}
  {{- end }}
