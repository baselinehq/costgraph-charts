{{- $needsControlPlane := not .Values.global.controlPlane.existingSecret }}
{{- $needsPostgres := not .Values.global.postgres.existingSecret }}
{{- if or $needsControlPlane $needsPostgres }}
{{- $data := dict }}
{{- if $needsControlPlane }}
{{- $_ := set $data "control-plane-api-key" .Values.global.controlPlane.apiKey }}
{{- with .Values.global.pricingApiKey }}
{{- $_ := set $data "pricing-api-key" . }}
{{- end }}
{{- end }}
{{- if $needsPostgres }}
{{- if .Values.global.postgres.bundled.enabled }}
{{- $_ := set $data "postgres-url" (include "costgraph-selfhosted.bundledPostgresURL" .) }}
{{- else }}
{{- $_ := set $data "postgres-url" .Values.global.postgres.url }}
{{- $_ := set $data "postgres-password" .Values.global.postgres.password }}
{{- end }}
{{- end }}
{{ include "costgraph.secret" (dict
    "ctx" $
    "name" (include "costgraph-selfhosted.fullname" .)
    "labels" (include "costgraph-selfhosted.labels" . | fromYaml)
    "stringData" $data
) }}
{{- end }}
---
{{/*
Read back rather than regenerated: rotating these invalidates every issued API
key and makes anything encrypted with the old key unreadable. The encryption
key is double encoded so it decodes to exactly 32 bytes.
*/}}
{{ include "costgraph.secret" (dict
    "ctx" $
    "name" (printf "%s-generated" (include "costgraph-selfhosted.fullname" .))
    "labels" (include "costgraph-selfhosted.labels" . | fromYaml)
    "resourcePolicyKeep" true
    "preserve" (dict
        "api-key-secret" "randAlphaNum:48"
        "integrations-encryption-key" "randAlphaNum:32|b64enc")
) }}
