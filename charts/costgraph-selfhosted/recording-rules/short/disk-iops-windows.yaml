      # PVC unmounted duration (orphan detection)
      # Seconds since the PVC was last referenced by any pod's spec. Trick:
      # multiply by 0, add time() — the recorded value is the unix timestamp
      # of the sample when the PVC was mounted. last_over_time picks the most
      # recent sample where the series was alive within the 30d window;
      # subtracting from now() gives seconds since last mount. The rule
      # absents when the PVC was never mounted in the 30d window — engine's
      # DQ pipeline reports MISSING_METRICS in that case.
      # Detection cap: this rule cannot observe PVCs unmounted longer than
      # 30 days (the subquery range). For PVCs in that band the rule
      # absents and engine's DQ pipeline surfaces MISSING_METRICS — operators
      # should already have reclaimed the storage before that window.
      - record: costgraph:pvc_unmounted_seconds
        expr: |
          time() - last_over_time(
            (costgraph:pvc_mounted_by_pod * 0 + time())[30d:30m]
          )

