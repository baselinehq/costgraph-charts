{{- if .Values.serviceAccount.create -}}
{{- include "costgraph-operator.assertClusterDiscovery" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "costgraph-operator.serviceAccountName" . }}
  labels:
    {{- include "costgraph-operator.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "costgraph-operator.fullname" . }}-view
  labels:
    {{- include "costgraph-operator.labels" . | nindent 4 }}
rules:
  # core/v1 is enumerated rather than wildcarded: RBAC has no deny rule, so
  # naming the resources is the only way secrets, configmaps and
  # serviceaccounts stay unreachable at the API server.
  - apiGroups: [""]
    resources:
      - endpoints
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - replicationcontrollers
      - resourcequotas
      - services
    verbs: ["get", "watch", "list"]
  {{- range include "costgraph-operator.builtinRules" . | fromYamlArray }}
  - apiGroups: {{ .apiGroups | toJson }}
    resources: {{ .resources | toJson }}
    verbs: ["get", "watch", "list"]
  {{- end }}
  {{- $customGroups := include "costgraph-operator.grantedAPIGroups" . | fromYamlArray }}
  {{- if and .Values.rbac.grantCustomResources $customGroups }}
  - apiGroups:
      {{- range $customGroups }}
      - {{ . | quote }}
      {{- end }}
    resources: ["*"]
    verbs: ["get", "watch", "list"]
  {{- end }}
  - apiGroups: [""]
    resources: ["pods/proxy", "nodes/proxy"]
    verbs: ["get"]
  {{- with .Values.rbac.extraRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "costgraph-operator.fullname" . }}
  labels:
    {{- include "costgraph-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "costgraph-operator.fullname" . }}-view
subjects:
- kind: ServiceAccount
  name: {{ include "costgraph-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
