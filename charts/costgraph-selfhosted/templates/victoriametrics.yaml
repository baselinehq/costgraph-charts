{{- if .Values.global.metricsStore.bundled.enabled }}
{{- $name := printf "%s-victoria-metrics" (include "costgraph-selfhosted.fullname" .) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "costgraph-selfhosted.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics-store
spec:
  ports:
    - port: 8428
      targetPort: http
      name: http
  selector:
    {{- include "costgraph-selfhosted.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: metrics-store
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "costgraph-selfhosted.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics-store
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "costgraph-selfhosted.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metrics-store
  template:
    metadata:
      labels:
        {{- include "costgraph-selfhosted.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: metrics-store
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: victoria-metrics
          image: {{ .Values.global.metricsStore.bundled.image }}
          imagePullPolicy: IfNotPresent
          args:
            - --storageDataPath=/storage
            - --retentionPeriod={{ .Values.global.metricsStore.bundled.retentionPeriod }}
          ports:
            - name: http
              containerPort: 8428
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.global.metricsStore.bundled.resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /storage
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.global.metricsStore.bundled.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.global.metricsStore.bundled.storage }}
{{- end }}
