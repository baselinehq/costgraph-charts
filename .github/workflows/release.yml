name: Release Charts

on:
  push:
    branches:
      - main

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Add Helm Dependency Repositories
        run: |
          for chart in charts/*/Chart.yaml; do
            if [ -f "$chart" ]; then
              echo "Processing $chart"
              # Extract repository URLs from dependencies
              yq eval '.dependencies[].repository' "$chart" 2>/dev/null | while read -r repo_url; do
                if [ -n "$repo_url" ] && [ "$repo_url" != "null" ]; then
                  # Name the repo after its path (bitnami from
                  # https://charts.bitnami.com/bitnami), falling back to the host
                  # when there is no path. Without the fallback a host-only URL
                  # became its own name, helm rejected it, and packaging then
                  # failed with "no repository definition".
                  repo_name=$(echo "$repo_url" | sed -E 's|https?://[^/]+/?||' | sed 's|/$||' | sed 's|/|-|g')
                  if [ -z "$repo_name" ]; then
                    repo_name=$(echo "$repo_url" | sed -E 's|https?://||' | sed 's|[/.]|-|g')
                  fi
                  echo "Adding repository: $repo_name -> $repo_url"
                  helm repo add "$repo_name" "$repo_url"
                fi
              done
            fi
          done
          helm repo update

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          packages_with_index: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
