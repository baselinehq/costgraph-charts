{{- $c := .Values.dcgmProfiling }}
{{- if $c.enabled }}
{{- $name := required "dcgmProfiling.applicationName is required" $c.applicationName }}
{{- include "costgraph.configMap" (dict
    "ctx"    $
    "name"   $name
    "labels" (fromYaml (include "costgraph-operator.componentLabels" (dict "ctx" $ "name" $name "component" "dcgm-profiling")))
    "data"   (dict "metrics" (required "dcgmProfiling.customMetrics is required" $c.customMetrics))) }}
{{- end }}
