{{- $needsControlPlane := not .Values.global.controlPlane.existingSecret }}
{{- $needsPostgres := not .Values.global.postgres.existingSecret }}
{{- if or $needsControlPlane $needsPostgres }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "costgraph-selfhosted.fullname" . }}
  labels:
    {{- include "costgraph-selfhosted.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $needsControlPlane }}
  control-plane-api-key: {{ .Values.global.controlPlane.apiKey | quote }}
  {{- with .Values.global.pricingApiKey }}
  pricing-api-key: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if $needsPostgres }}
  {{- if .Values.global.postgres.bundled.enabled }}
  postgres-url: {{ include "costgraph-selfhosted.bundledPostgresURL" . | quote }}
  {{- else }}
  postgres-url: {{ .Values.global.postgres.url | quote }}
  postgres-password: {{ .Values.global.postgres.password | quote }}
  {{- end }}
  {{- end }}
{{- end }}
---
{{- $name := printf "%s-generated" (include "costgraph-selfhosted.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "costgraph-selfhosted.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  api-key-secret: {{ index $existing.data "api-key-secret" }}
  integrations-encryption-key: {{ index $existing.data "integrations-encryption-key" }}
  {{- else }}
  api-key-secret: {{ randAlphaNum 48 | b64enc | quote }}
  # Must decode to exactly 32 bytes.
  integrations-encryption-key: {{ randAlphaNum 32 | b64enc | b64enc | quote }}
  {{- end }}
