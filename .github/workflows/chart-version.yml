name: Chart Version

# No paths filter: a skipped workflow never reports a status, which would hang
# every non-chart PR if this is a required check.
on:
  pull_request:

jobs:
  version-bump:
    name: Chart version bumped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          rc=0
          # README.md is excluded: helm-docs regenerates and pushes it into the
          # PR branch, so counting it would demand a bump for docs-only changes.
          charts=$(git diff --name-only "$BASE_SHA" HEAD -- charts/ ':!charts/*/README.md' \
            | awk -F/ 'NF > 2 { print $1 "/" $2 }' | sort -u)

          for chart in $charts; do
            [ -f "$chart/Chart.yaml" ] || continue                       # deleted
            git cat-file -e "$BASE_SHA:$chart/Chart.yaml" 2>/dev/null || continue  # new chart
            base=$(git show "$BASE_SHA:$chart/Chart.yaml" | yq -r '.version') || { rc=1; continue; }
            head=$(yq -r '.version' "$chart/Chart.yaml") || { rc=1; continue; }

            for v in "$base" "$head"; do
              case "$v" in
                ""|null)
                  echo "::error file=$chart/Chart.yaml::$chart has no version"
                  rc=1
                  continue 2
                  ;;
              esac
            done

            if [ "$base" = "$head" ]; then
              echo "::error file=$chart/Chart.yaml::$chart changed but version is still $head - bump it or the release publishes nothing."
              rc=1
            elif ! python3 .github/scripts/semver_gt.py "$base" "$head"; then
              echo "::error file=$chart/Chart.yaml::$chart version did not move forward: $base -> $head"
              rc=1
            else
              echo "$chart: $base -> $head"
            fi
          done
          exit $rc
